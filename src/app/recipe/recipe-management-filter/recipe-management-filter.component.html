<h5>Filter By:</h5>
<div class="container-fluid">
  <form [formGroup]="recipefilterForm" (ngSubmit)="SearchfilterValue()">
    <div class="form-group">
      <div class="row">
        <div class="col-sm-2">
            <div class="col">
              <label for="Category">Category:</label>
            </div>
            <div class="col">
              <select formControlName="Category" class="myselect">
                <option disabled selected>Select Category</option>
                <!-- <option *ngFor='let c of countryData' [ngValue]="c.country">
                  {{c.country}}
                </option> -->
              </select>
            </div>
          </div>
        <div class="col-sm-2">
            <div class="col">
              <label for="UserId">UserId:</label>
            </div>
            <div class="col">
              <input type="text" class="form-control" formControlName="UserId">
            </div>
          </div>
        <div class="col-sm-2">
          <div class="col">
            <label for="UserName">UserName:</label>
          </div>
          <div class="col">
            <input type="text" class="form-control" formControlName="UserName">
          </div>
        </div>
        <div class="col-sm-2">
          <div class="col">
            <label for="Email">Email:</label>
          </div>
          <div class="col">
            <input type="text" class="form-control" formControlName="Email">
          </div>
        </div>
        <div class="col-sm-2">
          <div class="col">
            <label for="Title">Title:</label>
          </div>
          <div class="col">
            <input type="text" class="form-control" formControlName="Title">
          </div>
        </div>
        <div class="col-sm-2">
            <div class="col">
              <label for="RecipeCreationdatepicker">Created date:</label>
            </div>
            <div class="col">
              <div class="row row-cols-sm-auto">
                <div class="col-12">
                  <div class="dp-hidden position-absolute">
                    <div class="input-group">
                      <input name="RecipeCreationdatepicker" class="form-control" ngbDatepicker
                        #RecipeCreationdatepicker="ngbDatepicker" [autoClose]="'outside'"
                        (dateSelect)="onDateSelection($event)" [displayMonths]="2" [dayTemplate]="t"
                        outsideDays="hidden" [startDate]="fromDate!" tabindex="-1">
                      <ng-template #t let-date let-focused="focused">
                        <span class="custom-day" [class.focused]="focused"
                          [class.faded]="isDateHovered(date) || isDateInside(date)"
                          [class.range]="isDateRange(date)" (mouseenter)="hoveredDate = date"
                          (mouseleave)="hoveredDate = null">
                          {{ date.day }}
                        </span>
                      </ng-template>
                    </div>
                  </div>
                  <div class="input-group">
                    <input #FromDate class="form-control" placeholder="From" name="FromDate"
                      [value]="formatter.format(fromDate)"
                      (input)="fromDate = validateDateInput(fromDate, FromDate.value)">
                    <button class="btn btn-sm btn-outline-secondary calendar" (click)="RecipeCreationdatepicker.toggle()"
                      type="button">📅</button>
                  </div>
                </div>
                <div class="col-12">
                  <div class="input-group">
                    <input #ToDate class="form-control" placeholder="Till" name="ToDate"
                      [value]="formatter.format(toDate)"
                      (input)="toDate = validateDateInput(toDate, ToDate.value)">
                    <button class="btn btn-sm btn-outline-secondary calendar" (click)="RecipeCreationdatepicker.toggle()"
                      type="button">📅</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
      </div>
    </div>
    &nbsp;
    <!-- <div class="form-group">
      <div class="row">
      
       
      </div>
    </div> -->
    <div class="form-group align-middle" >
      <button class=" btn btn-outline-primary">Search</button>&nbsp;
      <button class=" btn btn-outline-secondary" (click)="Reset()">Clear</button>
    </div>
  </form>
</div>

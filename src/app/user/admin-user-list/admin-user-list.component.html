<div class="row">
  <div class="col-12">
    <div class="card">
      <div class="card-body">
        <div class="row">
          <div class="col-6">
            <h4 class="card-title">List of Admin Users</h4>
          </div>
          <div class="col-6">
            <button class="btn btn-sm btn-outline-primary float-end" (click)="open(mymodal)">Create user</button>
          </div>
        </div>
        
        <div class="table-responsive">
          <table class="table table-hover table-bordered align-middle text-nowrap">
            <thead>
              <tr>
                <!-- <th scope="col">#</th> -->
                <th class="text-dark font-medium fs-4">Name</th>
                <th class="text-dark font-medium fs-4">Email</th>
                <th class="text-dark font-medium fs-4">UserName</th>
                <th class="text-dark font-medium fs-4">RoleId</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let ts of Userlist;index as i">
                <!-- <th scope="row">{{ i + 1 }}</th> -->
                <td class="fs-4">{{ts.name}}</td>
                <td class="fs-4">{{ts.email}}</td>
                <td class="fs-4">{{ts.userName}}</td>
                <td class="fs-4">{{ts.roleId}}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>
</div>
<ngb-pagination [collectionSize]="collectionSize" [pageSize]="pageSize" [(page)]="page"
  (pageChange)="GetAdminUserList()" aria-label="Default pagination"></ngb-pagination>
<ng-template #mymodal let-modal>
  <div class="modal-header">
    <h4 class="modal-title" id="modal-basic-title">Create New Admin user</h4>
    <button type="button" class="close" aria-label="Close" (click)="modal.dismiss('Cross click')">
      <span aria-hidden="true">×</span>
    </button>
  </div>
  <div class="modal-body">
    <div class="card">
      <div class="card-body">
        <!-- <h4 class="card-title">Create New Admin User</h4> -->
        <form [formGroup]="adminForm" (ngSubmit)="CreateAdminUser()">
          <div class="form-group">
            <label for="firstName"> Name</label>
            <input type="text" formControlName="name" class="form-control"
              [ngClass]="{ 'is-invalid': submitted && f.name.errors }" />
            <div *ngIf="submitted && f.name.errors" class="invalid-feedback">
              <div *ngIf="f.name.errors.required">Name is required</div>
            </div>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" formControlName="email" class="form-control"
              [ngClass]="{ 'is-invalid': submitted && f.email.errors }" />
            <div *ngIf="submitted && f.email.errors" class="invalid-feedback">
              <div *ngIf="f.email.errors.required">Email is required</div>
              <div *ngIf="f.email.errors?.pattern">Email address is invalid</div>
            </div>
          </div>
          <div class="form-group">
            <label for="username">User Name</label>
            <input type="text" formControlName="username" class="form-control"
              [ngClass]="{ 'is-invalid': submitted && f.username.errors }" />
            <div *ngIf="submitted && f.username.errors" class="invalid-feedback">
              <div *ngIf="f.username.errors.required">User Name is required</div>
            </div>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" formControlName="password" class="form-control"
              [ngClass]="{ 'is-invalid': submitted && f.password.errors }" />
            <div *ngIf="submitted && f.password.errors" class="invalid-feedback">
              <div *ngIf="f.password.errors.required">Password is required</div>
              <div *ngIf="f.password.errors.minlength">Password must be at least 6 characters</div>
            </div>
          </div>
          <div class="form-group" style="margin-top: 25px">
            <button [disabled]="loading" class="btn btn-primary">
              <span *ngIf="loading" class="spinner-border spinner-border-sm mr-1"></span>
              Save
            </button>
            &nbsp;
            <!-- <a routerLink="/dashboard" class="btn btn-dark">Cancel</a> -->
            <button type="button" class="btn btn-outline-dark" (click)="modal.close('Cancel click')">Cancel</button>

          </div>
        </form>
      </div>
    </div>
  </div>
  <!-- <div class="modal-footer">
    <button type="button" class="btn btn-outline-dark" (click)="modal.close('Save click')">Ok</button>
  </div> -->
</ng-template>
